name: Update verifikasi

# Verifikasi otomatis: prakiraan model (arsip lead time Open-Meteo) vs hujan satelit CMORPH (NOAA CPC) -> verifikasi.js.
# Inkremental: verif_obs.json (hujan per jam) dipulihkan dari cabang site, hanya jam baru yang diunduh. Run pertama mengisi 45 hari (±10 menit).
on:
  schedule:
    - cron: "37 23 * * *"       # 07:37 WITA
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: verif
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install numpy netCDF4
      - name: Pulihkan toko pengamatan dari cabang site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pipeline/publish_site.sh --restore verif_obs.json verif_fc.json ens_archive.json analisis_archive.json synop_97270.json
      - name: SYNOP Bima (WMO 97270) dari Ogimet
        continue-on-error: true          # Ogimet gangguan -> verifikasi CMORPH tetap jalan
        run: python pipeline/ingest_synop.py
      - name: Run
        env:
          OPENMETEO_API_KEY: ${{ secrets.OPENMETEO_API_KEY }}
        run: |
          ok=0
          for i in 1 2; do
            python pipeline/ingest_verif.py && { ok=1; break; }
            echo "gagal (percobaan $i)"; [ "$i" -lt 2 ] && sleep 180
          done
          [ "$ok" = 1 ] || { echo "::error::ingest_verif.py gagal 2x — verifikasi.js TIDAK diperbarui"; exit 1; }
      - name: Terbitkan ke cabang site (tanpa menambah riwayat git)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pipeline/publish_site.sh "verifikasi" verifikasi.js verif_obs.json verif_fc.json $(ls synop.js synop_97270.json 2>/dev/null)
