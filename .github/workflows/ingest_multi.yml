name: Update multi-model ensemble

# Ensemble multi-model (ECMWF IFS 51 · AIFS 51 · GEFS 31 · ICON-EPS 40) via Open-Meteo
# -> ens_multi.js. Ringan (hanya Python + numpy, tanpa GRIB), ±12 menit per run.
#
# Jadwal (UTC)  ->  WITA   Menangkap
#   10:17       ->  18:17  AIFS 00Z (masuk 09:03Z), GEFS 00Z/06Z, ICON-EPS 00Z   -> analisis sore (18-20 WITA)
#   18:17       ->  02:17  GEFS 12Z (masuk ±17:40Z) + ICON-EPS 12Z                -> SIKLUS 12Z SEBELUM TENGGAT 04:00
# 2 run/hari ≈ 4.100 "bobot" panggilan Open-Meteo (batas gratis 10.000/hari, 5.000/jam).
# (menit ganjil sengaja, supaya tidak kena antrean cron GitHub di jam bulat)

on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ens-multi
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install numpy

      - name: Pulihkan data sebelumnya dari cabang site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pipeline/publish_site.sh --restore ens_multi.js

      - name: Run pipeline
        env:
          # opsional: kunci API berbayar Open-Meteo (Settings > Secrets > OPENMETEO_API_KEY)
          OPENMETEO_API_KEY: ${{ secrets.OPENMETEO_API_KEY }}
        run: |
          for i in 1 2 3; do
            python pipeline/ingest_openmeteo_ens.py && break
            echo "gagal (percobaan $i) — tunggu 3 menit lalu ulang"; sleep 180
          done

      - name: Terbitkan ke cabang site (tanpa menambah riwayat git)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pipeline/publish_site.sh "multi-model ENS" ens_multi.js
