name: Update indeks iklim

# Niño 3.4 (mingguan), SOI & DMI (bulanan) dari NOAA -> dinamika.js. Sangat ringan (hanya Python standar), <1 menit.
on:
  schedule:
    - cron: "43 20 * * *"      # 04:43 WITA
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: climate
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        run: python pipeline/ingest_climate.py
      - name: Terbitkan ke cabang site (tanpa menambah riwayat git)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pipeline/publish_site.sh "indeks iklim" dinamika.js
