name: Update indeks iklim

# Niño 3.4 (mingguan), SOI & DMI (bulanan) dari NOAA -> dinamika.js. Sangat ringan (hanya Python standar), <1 menit.
on:
  schedule:
    - cron: "43 20 * * *"      # 04:43 WITA
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: climate
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        run: python pipeline/ingest_climate.py
      - name: Commit hasil
        run: |
          git config user.name "mosaic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dinamika.js
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: indeks iklim $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              sleep 15
            done
          fi
